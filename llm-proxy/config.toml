[server]
host = "127.0.0.1"
port = 8080

[upstream]
host = "openai.example.ai"
timeout_sec = 120   # per-attempt urlopen timeout to NVIDIA

[proxy]
# Leave false if you're launching this with `proxychains4 python3 main.py`.
# Set true (and fill in the two fields below) only if you want the script
# itself to tunnel through SOCKS5 instead of relying on proxychains.
use_socks5 = false
socks5_host = "127.0.0.1"
socks5_port = 1080

[logging]
enabled = true
log_dir = "logs"
# Cap on how many bytes of each response body get written to the log file.
body_limit_bytes = 200000

[retry]
# On these upstream status codes, hold the connection to Kilo open, wait,
# and silently re-send the same request — Kilo only ever sees the final
# outcome, never the failed attempt(s).
enabled = true
status_codes = [400, 425, 429, 500, 502, 529 ]
max_attempts = 10       # total tries, including the first — so 2 retries here
# pause_seconds is only the FALLBACK wait: if the upstream response has a
# Retry-After header, or a "try again in Xms" / "retry in Xs" hint in the
# error body, that number is used instead — pause_seconds only applies
# when neither is present. 500/502/529 almost never carry a Retry-After
# header or a body hint, so in practice this 30s fallback IS the wait for
# those three.
pause_seconds = 15
# A resolved wait longer than this (header or body hint) is treated as a
# quota reset rather than a transient limit — the error is forwarded to
# Kilo immediately instead of holding its connection open that long.
max_pause_seconds = 180
# Buffer the WHOLE upstream response and check it's structurally intact
# before sending anything to Kilo. This is what makes a real silent
# retry possible on a body that's corrupted or truncated MID-stream (a
# stray status line spliced into an SSE chunk, etc.) — a failure a
# status-code check alone can't see, because the initial status was a
# plain 200. Trade-off: Kilo no longer gets live token-by-token output,
# it gets the whole response at once, after upstream finishes.
validate_response_body = true
# Memory safety valve — once a response grows past this, it stops being
# buffered and is streamed straight through to the client instead, with
# no body validation (there is nothing left to validate against). It is
# NOT treated as a failure: an over-sized response is still a response.
# Shouldn't trigger for normal chat completions.
max_buffer_bytes = 50000000
# An SSE stream that just stops without a closing "data: [DONE]" counts
# as truncated, even if every line seen so far was individually valid
# JSON. Turn off if your upstream/model never sends one.
require_stream_done = false
# The check that still catches a truncated stream when require_stream_done
# is off: a completions stream in which no chunk ever reported a
# finish_reason was cut off mid-generation. This is what a response killed
# during a long reasoning phase looks like — the status is 200, every
# data: line parses, and only the missing finish_reason gives it away.
# Only applied to completion-shaped streams, and never when a closing
# [DONE] arrived. Turn off only if your upstream omits finish_reason
# entirely.
require_stream_finish_reason = true
# Wait before re-sending after a FAILED BODY (as opposed to a failed
# status code). A truncated body is not a rate limit, so it doesn't want
# the rate-limit-sized pause: with max_attempts = 10, reusing
# pause_seconds here would hold the client for 135s on a hiccup that
# usually clears on the first retry.
body_retry_pause_seconds = 2
