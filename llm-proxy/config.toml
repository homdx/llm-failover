[server]
host = "127.0.0.1"
port = 8080

[upstream]
host = "openai.example.ai"      # replace with your provider's hostname
scheme = "https"
# For Ollama: scheme = "http"
# For Ollama: host = "localhost:11434"

# Per-attempt connect/read timeout to the upstream (seconds).
# For Ollama use 3600 (1 hour).
timeout_sec = 60

# If the upstream has already sent at least one byte but then goes idle,
# the proxy keeps retrying reads until this many seconds have elapsed in
# total on that response.  Ordinary silent upstreams still hit timeout_sec.
# 300 = 5 minutes; 900 = 15 minutes for Ollama.
stream_max_wait_sec = 300

# How long the upstream may be completely silent before the proxy starts
# drippping ": keepalive" SSE comments to the client, committing to HTTP 200
# early so the client's headersTimeout (undici default: 5 min) is never hit.
# Only applied when "stream": true.  Trade-off: status code is spent early,
# so a masked 429/error arrives as an error chunk, not a real status.
# Set ABOVE a normal error round-trip, BELOW the client's own timeout.
# 0 = off (old behaviour).
heartbeat_after_sec = 90

# Gap between keepalive comments once the drip has started.
heartbeat_interval_sec = 20

# Optional User-Agent override.
#
# Some Cloudflare-fronted upstreams block or fingerprint Kilo Code's
# User-Agent string.  When user_agent is set to a non-empty value the proxy:
#   1. Drops EVERY User-Agent header the client sent (even duplicates).
#   2. Injects this string instead — on every attempt, including retries.
#   3. Also strips Kilo's identity headers that OpenRouter reads for its
#      app dashboard: HTTP-Referer, X-Title, X-KiloCode-Version.
#
# Rules enforced at startup (bad value → clear error, no silent failure):
#   • Must be a quoted string (not a number, not a boolean).
#   • Must be plain ASCII — no accented letters, no Cyrillic, etc.
#   • Must be a single line — no newlines or other control characters.
#
# Empty string or whitespace-only string = off; client's UA passes through.
#
# Example — replace with your own project name/URL:
# user_agent = "my-llm-client/1.0 (+https://github.com/you/your-repo)"
user_agent = ""
# ──────────────────────────────────────────────────────────────────────────

[proxy]
# Set false if you launch with `proxychains4 python3 main.py`.
# Set true to have the script itself tunnel through SOCKS5.
use_socks5 = true
socks5_host = "127.0.0.1"
socks5_port = 1080

[logging]
enabled = true
log_dir = "logs"
# Cap on how many bytes of each response body are written to the log file.
body_limit_bytes = 200000

[retry]
# On these upstream status codes the proxy silently retries; the client
# only ever sees the final outcome.
enabled = true
status_codes = [400, 425, 429, 500, 502, 529]
max_attempts = 10       # total tries including the first

# Fallback pause between retries (seconds).  Overridden by a Retry-After
# header or a "try again in Xms" hint in the error body when present.
# 500/502/529 rarely carry hints, so this IS the wait for those codes.
pause_seconds = 10

# A resolved wait longer than this is treated as a quota reset — the error
# is forwarded to the client immediately rather than blocking that long.
max_pause_seconds = 180
# For Ollama: 1800

# Flat pause after a network-level failure (timeout, DNS failure, dropped
# connection — no status line at all).  Retried like a 500/502.
network_error_pause_seconds = 60

# Buffer the whole upstream response and verify it is structurally intact
# before forwarding to the client.  Enables silent retry on a mid-stream
# corruption or truncation that a status-code check can't catch.
# Trade-off: client receives the whole response at once, not token-by-token.
validate_response_body = true
# For Ollama: validate_response_body = false

# Safety valve: once a buffered response exceeds this size it is streamed
# through immediately with no validation.  Not a failure — just a bypass.
# Shouldn't trigger for normal chat completions.
max_buffer_bytes = 50000000

# Treat an SSE stream that ends without "data: [DONE]" as truncated.
# Disable only if your upstream never sends a closing [DONE].
require_stream_done = false

# Treat a completion stream where NO chunk ever set finish_reason as
# truncated — catches responses killed mid-generation when the status was
# still 200 and every data: line parsed fine.
# Disable only if your upstream omits finish_reason entirely.
require_stream_finish_reason = true

# Pause before retrying a failed/truncated BODY (not a rate-limit, so a
# short wait is correct — usually clears on the first retry).
body_retry_pause_seconds = 2

# ── Concurrency / anti-thundering-herd ────────────────────────────────────
# Max requests talking to the upstream simultaneously.
# 0 = unlimited (old behaviour).  For a single free-tier key: 1 or 2.
# Extra requests queue instead of piling onto the limit.
max_concurrent_upstream = 3

# Hard ceiling on how long one request may spend retrying before giving up
# and answering the client.  0 = unlimited.
# Keep this under the client's own timeout.
max_total_retry_seconds = 45
# For Ollama: 0

# Random jitter applied when queued requests come off a shared cooldown,
# to avoid all firing at the same instant and re-triggering the limit.
cooldown_jitter_seconds = 0.5

# Exponential backoff factor for the fallback pause across attempts:
# pause × factor^attempt — e.g. 10s, 20s, 40s … capped at max_pause_seconds.
# Only applies when the upstream gave no Retry-After / body hint.
# 1.0 = flat (old behaviour).
backoff_factor = 2.0
