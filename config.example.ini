# =====================================================================
# config.example.ini — every key llm_client.py / llm_pool.py can read.
#
# NOTE ON COMMENTS: configparser is used with default settings, which do
# NOT support inline comments. Keep comments on their own lines; never
# write "retries = 2  ; two retries" — the value would become "2  ; two
# retries" and getint() would fail.
#
# Which client you get:
#   [api] pool is empty/absent  -> a plain LLMClient for section api_<active>
#   [api] pool lists 2+ sections -> a PooledClient over those sections
# Both paths are built by LLMClient.from_config(), so every [api] key
# below applies identically in either mode (PARITY-1).
# =====================================================================


# ---------------------------------------------------------------------
# [api] — settings shared by ALL servers. Read by both modes.
# ---------------------------------------------------------------------
[api]

# Which api_<name> section to use when `pool` is not set.
# Default: local  ->  section [api_local]
active = local

# Pool of servers: a comma-separated list of SECTION NAMES (not URLs).
# Leave empty / delete the line for single-server mode.
# Sections may differ in model, num_ctx, api_format — a spare server with
# a weaker model beats a failed call.
# Default: "" (empty)
pool =

# How many times a failed call is repeated on ANOTHER free server of the
# pool. Ignored in single-server mode. Not the number of servers: 2
# servers must not turn into 2 retries of every call.
# Default: 1
max_failover = 1

# Verify TLS certificates. Set to false only for a self-signed gateway.
# Default: true
verify_ssl = true

# Per-request socket timeout, seconds. On a CPU laptop a real answer can
# take 5-15 minutes, and a timeout is treated as "slow server", not
# "dead server", so a generous value is safe.
# Default: 120
timeout_seconds = 900

# RETRY-1: EXTRA attempts on any failure (timeout, broken JSON, transient
# error). Each retry raises the temperature and perturbs the prompt tail,
# so it is not an exact copy of the previous attempt. 0 = one attempt.
# Default: 1
retries = 2

# HTTP-RETRY: EXTRA attempts on an error status (402 "out of credits",
# 5xx, ...) and on broken JSON. Repeats the SAME request unchanged after
# a pause. 0 = fail immediately.
# Default: 2
error_retries = 2

# Seconds to wait before each of those attempts. Ignored when the server
# states an exact delay itself (Retry-After header, or "try again in
# 820ms" / "retry in 57.06s" in the error body) — that figure wins.
# Default: 60
error_retry_wait_sec = 60

# RATE-3: ceiling on any 429 wait, seconds. If the server asks for longer
# than this, do NOT sleep — raise instead, so the pool can switch server
# and the run is not blocked. Real case: Groq answered a DAILY-limit 429
# with Retry-After=1754s (29 min). Typical per-minute TPM pauses are
# seconds to tens of seconds and stay under this cap.
# Default: 180
max_retry_after_sec = 180

# RATE-ROT: on a 429, do not sleep — hand the turn to the next model in
# the list. Only has an effect when a section lists several models.
# Rationale: Groq/Gemini count limits PER MODEL, so a sibling model
# answers right now, and sleeping is a wasted minute. Set to false to
# restore the old behaviour (sleep and repeat the same model).
# Default: true
rotate_on_429 = true

# How many EXTRA full passes over the model list to make when a whole
# pass came back 429 on every model — which means the limit is per KEY,
# not per model, and switching models cannot dodge it. Only then is
# sleeping worth it: the wait is the MINIMUM the models asked for, capped
# by max_retry_after_sec. 0 = one pass, then raise, with no pause at all.
# Default: 1
rate_limit_cycles = 1

# Send a JSON-mode field ("format": "json" for ollama, "response_format"
# for openai). Set to false for a strict gateway that rejects unknown
# fields — otherwise leave true: the client detects the 400, retries
# without the field and remembers that server, so this is only a way to
# skip the one wasted request.
# Default: true
json_format = true


# ---------------------------------------------------------------------
# [api_local] — local Ollama. Selected by active = local.
# ---------------------------------------------------------------------
[api_local]

# base_url (REQUIRED). Bare host is fine: /api/chat is appended
# automatically, and an explicit .../api or .../api/chat is left alone.
base_url = http://localhost:11434

# api_format: ollama | openai
# Default: ollama
api_format = ollama

# model (REQUIRED). A comma-separated list enables MODEL-FALLBACK: when
# one model runs out of retries the next gets a full set of attempts.
# Duplicate names are removed automatically.
model = qwen3:8b

# Not needed by ollama, but harmless.
# Default: not-needed
api_key = not-needed

# Context window passed as options.num_ctx. 0 = let the server decide.
# If prompt_eval_count approaches this value, empty answers are context
# overflow, not a sampling glitch (LLM_DEBUG spells this out).
# Default: 0
num_ctx = 8192

# Reasoning control. Omit the key entirely to send nothing.
#   false -> suppress thinking; true -> ask for it
# For api_format=ollama this becomes payload "think".
# Default: unset
think = false


# ---------------------------------------------------------------------
# [api_remote] — remote OpenAI-compatible server (Jan, Groq, OpenRouter,
# Gemini, HF router, vLLM/SGLang, ...). Selected by active = remote.
# ---------------------------------------------------------------------
[api_remote]

# base_url (REQUIRED). /chat/completions is appended, so give the root
# WITH the version prefix and WITHOUT a trailing slash.
base_url = https://api.groq.com/openai/v1

api_format = openai

# api_key (REQUIRED here) — sent as "Authorization: Bearer <key>".
api_key = gsk_replace_me

# Model list for MODEL-FALLBACK. Order matters only at first use: the
# position of the last WORKING model is remembered per base_url and
# shared by every client on it, so later calls start there, not at zero.
model = qwen3.6-27b, llama-3.3-70b-versatile, gemma2-9b-it

num_ctx = 0

# For api_format=openai, think=false makes the client send all three
# suppression fields at once: chat_template_kwargs.enable_thinking
# (vLLM/SGLang), reasoning_effort (native OpenAI), and reasoning
# (OpenRouter). A server that rejects one of them with HTTP 400 gets that
# ONE field disabled and remembered — the other two keep working. If the
# server objects to the VALUE instead ("must be one of `none` or
# `default`"), the value is taken from the hint, not the field dropped.
think = false


# ---------------------------------------------------------------------
# [api_remote2] — second server, used only when listed in [api] pool.
# ---------------------------------------------------------------------
[api_remote2]

base_url = https://generativelanguage.googleapis.com/v1beta/openai
api_format = openai
api_key = AIza_replace_me
model = gemini-2.5-flash, gemini-2.0-flash
num_ctx = 0
think = false


# =====================================================================
# HOW TO SWITCH MODES
#
#   local single server:   active = local     and leave pool empty
#   remote single server:  active = remote    and leave pool empty
#   pool of two servers:   pool = api_remote, api_remote2
#                          (then `active` is not used at all)
#
# NOT read from this file: LLM_DEBUG is an environment variable, not an
# ini key —  LLM_DEBUG=1 python your_script.py
# =====================================================================
